name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gawk mawk busybox original-awk
      - run: shellcheck skills/ste80/scripts/ste_check.sh tests/test_ste_check.sh
      - name: Checker tests on each awk
        run: |
          for awk in gawk mawk "busybox awk" original-awk; do
            echo "== $awk"
            STE_AWK="$awk" sh tests/test_ste_check.sh
          done

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes @anthropic-ai/claude-code@2.1.318 plugin validate .
